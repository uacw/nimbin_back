ktor:
  application:
    modules:
      - tech.nimbus.ApplicationKt.module
  development: false

jwt:
  secret: ${?JWT_SECRET:"local-development-jwt-secret-key-change-in-production"}
  issuer: ${?JWT_ISSUER:"http://localhost:8080/"}
  audience: ${?JWT_AUDIENCE:"http://localhost:8080/api"}
  realm: ${?JWT_REALM:"Access to 'api'"}

# Настройки для локальной разработки (игнорируются на Heroku при наличии DATABASE_URL)
database.driver: "org.postgresql.Driver"
database.url: "jdbc:postgresql://localhost:5432/nimbin_dev"
database.user: "postgres"
database.password: "postgres"
